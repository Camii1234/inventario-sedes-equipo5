server:
  port: 8080
  # Respeta X-Forwarded-Host/Proto del proxy Nginx del frontend para que los enlaces HATEOAS
  # apunten al host y puerto que usa el navegador.
  forward-headers-strategy: framework

spring:
  application:
    name: inventario-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/inventario?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USER:inventario}
    password: ${DB_PASSWORD:inventario_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-null-for-primitives: true
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
  default-produces-media-type: application/hal+json
