# Fuentes de datos de Grafana. Los uid fijos permiten enlazar métricas, logs y trazas entre sí.
# En este archivo Grafana expande $VARIABLE, por eso los literales con $ se escriben como $$.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 10s
      # Exemplars: desde un punto de latencia se salta a la traza correspondiente en Tempo.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # El trace_id llega como metadato estructurado desde OpenTelemetry: enlace directo a Tempo.
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Ver traza en Tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceId: false
        filterBySpanId: false
        customQuery: true
        query: '{service_name="inventario-api"} | trace_id="$${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        queries:
          - name: Latencia p95 de la API
            query: 'histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="inventario-api"}[1m])))'
      nodeGraph:
        enabled: true
      search:
        hide: false

  # Paneles de negocio (stock y productos por sede) leídos directamente de MySQL con un usuario de solo lectura.
  - name: MySQL inventario
    uid: mysql-inventario
    type: mysql
    access: proxy
    url: mysql:3306
    user: grafana_lector
    jsonData:
      database: $INVENTARIO_DB_NAME
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      timezone: "UTC"
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
