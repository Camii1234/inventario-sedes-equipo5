# Sirve el build de React y redirige la API al contenedor del backend por la red de Compose.
# Se reenvía el Host público (con puerto) para que los enlaces HATEOAS apunten a este mismo origen.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Swagger UI y contrato OpenAPI también accesibles desde el puerto del frontend.
    location ~ ^/(swagger-ui|swagger-ui\.html|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Contadores de Nginx para nginx-prometheus-exporter (observabilidad). Solo redes privadas.
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
